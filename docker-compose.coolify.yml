services:
  web:
    build:
      context: .
      dockerfile_inline: |
        FROM nginx:1.27-alpine
        COPY static/ /usr/share/nginx/html/
        COPY nginx.conf /etc/nginx/conf.d/default.conf
        COPY nginx-security.conf /etc/nginx/includes/security-headers.conf
        EXPOSE 80
    environment:
      - SERVICE_FQDN_WEB=jesusjbriceno.dev
      - SERVICE_URL_WEB=https://jesusjbriceno.dev
    ports:
      - "80"
